# Blueprint de Render (staging desde develop).
# La API se despliega cuando esten definidos Postgres, Redis y las variables
# de entorno del spec 002 (ver apps/api/src/config/env.validation.ts).
services:
  - type: web
    name: apuestas-reports
    runtime: python
    plan: free
    rootDir: apps/reports
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    branch: develop
