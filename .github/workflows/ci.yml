name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  node:
    name: Lint, tipos, tests y build (Node)
    runs-on: ubuntu-latest
    env:
      # Prisma parses both datasource URLs during generate; no database is contacted.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      MIGRATION_DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Lint y tests (reportes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reports
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  sonarqube:
    name: SonarQube (quality gate)
    runs-on: ubuntu-latest
    needs: [node, python]
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
